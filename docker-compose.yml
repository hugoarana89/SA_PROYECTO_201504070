services:
  # =============================
  # AUTH DATABASE
  # =============================
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 201504070
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
      - ./backend/sql/init-auth.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # =============================
  # RESTAURANT DATABASE
  # =============================
  mysql-restaurant:
    image: mysql:8.0
    container_name: mysql-restaurant
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 201504070
      MYSQL_DATABASE: restaurant_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_restaurant_data:/var/lib/mysql
      - ./backend/sql/init-restaurant.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # =============================
  # ORDER DATABASE
  # =============================
  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 201504070
      MYSQL_DATABASE: order_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_order_data:/var/lib/mysql
      - ./backend/sql/init-order.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p201504070", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =============================
  # AUTH SERVICE
  # =============================
  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.auth-service
    container_name: auth-service
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql-auth
    depends_on:
      mysql-auth:
        condition: service_healthy
    ports:
      - "50051:50051"

  # =============================
  # RESTAURANT SERVICE
  # =============================
  restaurant-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.restaurant-service
    container_name: restaurant-service
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql-restaurant
    depends_on:
      mysql-restaurant:
        condition: service_healthy
    ports:
      - "50052:50052"

  # =============================
  # ORDER SERVICE
  # =============================
  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.order-service
    container_name: order-service
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql-order
      RESTAURANT_SERVICE_URL: restaurant-service:50052
    depends_on:
      mysql-order:
        condition: service_healthy
      restaurant-service:
        condition: service_started
    ports:
      - "50053:50053"

  # =============================
  # API GATEWAY
  # =============================
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.api-gateway
    container_name: api-gateway
    env_file:
      - ./backend/.env
    environment:
      AUTH_SERVICE_URL: auth-service:50051
      RESTAURANT_SERVICE_URL: restaurant-service:50052
      ORDER_SERVICE_URL: order-service:50053
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
    ports:
      - "4000:4000"

  # =============================
  # FRONTEND
  # =============================
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  mysql_auth_data:
  mysql_restaurant_data:
  mysql_order_data:
